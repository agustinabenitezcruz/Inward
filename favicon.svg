<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="INWARD">
  <title>INWARD</title>
  <!-- El icono cambia de color con el tema del navegador.
       El SVG se evalua solo: un favicon SVG arrastra su propia hoja de
       estilos y su propia consulta de medios, asi que esto no necesita ni una
       linea de JavaScript ni un segundo archivo.
       El fill del <g> es el valor por defecto y la clase lo pisa: un motor que
       no entienda la regla igual pinta el violeta de marca en vez de negro.
       Sobre barra clara va el violeta de marca; sobre barra oscura, blanco. -->
  <style>
    .ico{fill:#202045}
    @media (prefers-color-scheme:dark){ .ico{fill:#ffffff} }
  </style>
